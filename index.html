<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ff0055" />
    <!-- Android -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Frosty Bite" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/logo_192.png" />
    <link rel="apple-touch-icon" href="/logo_512.png" />
    <title>Frosty Bite</title>
    <meta name="description" content="Artisan bakery and frosty treats">
    <script>
      (function() {
        // Intercept global WebSocket creation to silence connection errors in sandboxed environments
        if (window.WebSocket) {
          var OriginalWebSocket = window.WebSocket;
          var SafeWebSocket = function(url, protocols) {
            var instance;
            try {
              if (protocols) {
                instance = new OriginalWebSocket(url, protocols);
              } else {
                instance = new OriginalWebSocket(url);
              }
            } catch (e) {
              console.warn("Silenced benign WebSocket preview error:", e);
              instance = {};
            }
            
            // Safe listener attach to prevent error propagation 
            if (instance && typeof instance.addEventListener === 'function') {
              instance.addEventListener('error', function(event) {
                try {
                  event.preventDefault();
                  event.stopImmediatePropagation();
                } catch(_) {}
              });
            }
            return instance;
          };
          SafeWebSocket.prototype = OriginalWebSocket.prototype;
          for (var key in OriginalWebSocket) {
            if (OriginalWebSocket.hasOwnProperty(key)) {
              SafeWebSocket[key] = OriginalWebSocket[key];
            }
          }
          window.WebSocket = SafeWebSocket;
        }

        function isBenign(msg) {
          if (!msg) return false;
          var m = String(msg).toLowerCase();
          return m.includes('websocket') || 
                 m.includes('web socket') || 
                 m.includes('closed without opened') || 
                 m.includes('closeevent') || 
                 m.includes('vite') ||
                 m.includes('hmr');
        }
        window.addEventListener('error', function(e) {
          var msg = e.message || (e.error ? e.error.message : '');
          if (isBenign(msg)) {
            try {
              e.preventDefault();
              e.stopImmediatePropagation();
            } catch(_) {}
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = reason ? (reason.message || reason.description || reason.reason || reason) : '';
          var constructorName = (reason && reason.constructor) ? String(reason.constructor.name) : '';
          if (isBenign(msg) || isBenign(constructorName) || (reason && (reason.type === 'close' || reason.type === 'error' || reason.wasClean !== undefined))) {
            try {
              e.preventDefault();
              e.stopImmediatePropagation();
            } catch(_) {}
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
